<style>
    .glow-sm {
        filter: drop-shadow(0 0 5px rgba(145, 206, 241, 0.4));
    }

    @keyframes pulse-glow {

        0%,
        100% {
            box-shadow: 0 4px 12px -2px rgba(254, 208, 0, 0.3);
            filter: drop-shadow(0 0 4px rgba(254, 208, 0, 0.2));
        }

        50% {
            box-shadow: 0 4px 20px 2px rgba(254, 208, 0, 0.6);
            filter: drop-shadow(0 0 10px rgba(254, 208, 0, 0.5));
        }
    }

    .nav-links-container {
        position: relative;
    }

    .nav-accent-line {
        position: absolute;
        bottom: -4px;
        height: 3px;
        background-color: #fed000;
        border-radius: 9999px;
        transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        pointer-events: none;
        opacity: 0;
        /* Hidden until positioned */
    }

    .nav-links-container:hover .nav-accent-line {
        animation: pulse-glow 2s ease-in-out infinite;
    }
</style>

<nav
    class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl border-b border-outline-variant/20 shadow-[0_0_15px_rgba(145,206,241,0.1)] h-20 transition-all duration-300 ease-in-out">
    <div class="flex justify-between items-center h-full px-margin-desktop max-w-container-max mx-auto">
        <div class="font-headline-lg text-headline-lg text-primary tracking-tighter cursor-pointer flex items-center gap-2"
            onclick="window.location.href='index.html'">
            Southern Cross University
        </div>

        <div class="hidden md:flex items-center gap-gutter nav-links-container h-full relative" id="universalNavLinks">
            <a class="nav-item flex items-center h-full text-on-surface-variant hover:text-secondary-container transition-colors duration-300 font-body-md text-body-md px-2"
                href="index.html">Home</a>
            <a class="nav-item flex items-center h-full text-on-surface-variant hover:text-secondary-container transition-colors duration-300 font-body-md text-body-md px-2"
                href="stats.html">Discord Stats</a>
            <a class="nav-item flex items-center h-full text-on-surface-variant hover:text-secondary-container transition-colors duration-300 font-body-md text-body-md px-2"
                href="announcement.html">Announcements</a>
            <a class="nav-item flex items-center h-full text-on-surface-variant hover:text-secondary-container transition-colors duration-300 font-body-md text-body-md px-2"
                href="Tournament/dashboard.html">Tournaments</a>

            <div class="nav-accent-line" id="navAccent"></div>
        </div>

        <div class="flex items-center gap-gutter">
            <div class="hidden lg:flex items-center gap-4">
                <span
                    class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:text-primary transition-colors">notifications</span>
                <span
                    class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:text-primary transition-colors">person</span>
            </div>
            <a href="https://discord.gg/rEEFTuRpam"
                class="bg-primary text-on-primary font-headline-lg-mobile text-headline-lg-mobile px-6 py-2 rounded-lg hover:scale-105 transition-all glow-sm font-bold">
                Join Club
            </a>
        </div>
    </div>
</nav>

<script>
    (function () {
        const navAccent = document.getElementById('navAccent');
        const navItems = document.querySelectorAll('.nav-item');

        // 1. Auto-Detect and Highlight Active Page based on the current URL path
        const currentPath = window.location.pathname.split('/').pop() || 'index.html';
        let activeItem = null;

        navItems.forEach(item => {
            const itemHref = item.getAttribute('href');

            // Match page filenames or handle specific section anchors like #community
            if (itemHref === currentPath || (currentPath === 'index.html' && itemHref.startsWith('index.html#'))) {
                activeItem = item;
            }
        });

        // Fallback default to Home if no clean match found
        if (!activeItem) activeItem = navItems[0];

        // Apply distinct active highlighting styles matching your theme design
        activeItem.classList.remove('text-on-surface-variant');
        activeItem.classList.add('text-secondary-container', 'font-bold');

        // 2. Linear Tracking Mechanics Function
        function positionAccent(element) {
            if (!element || !navAccent) return;
            navAccent.style.left = `${element.offsetLeft}px`;
            navAccent.style.width = `${element.offsetWidth}px`;
            navAccent.style.opacity = '1';
        }

        // Initialize positioning targets safely once fonts and dimensions settle
        setTimeout(() => positionAccent(activeItem), 80);
        window.addEventListener('resize', () => positionAccent(activeItem));

        // Assign slider interactive listeners 
        navItems.forEach(item => {
            item.addEventListener('mouseenter', () => positionAccent(item));
            item.addEventListener('mouseleave', () => positionAccent(activeItem));
        });
    })();
</script>
