<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tournaments | SCU Tournaments</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/tournament.css">
</head>
<body>
    <!-- Animated Particles -->
    <div class="bg-particles">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h1>SCU Tournaments</h1>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="t-nav-item"><span class="material-symbols-outlined">dashboard</span> Dashboard</a>
                <a href="games.html" class="t-nav-item"><span class="material-symbols-outlined">sports_esports</span> Games</a>
                <a href="tournaments.html" class="t-nav-item active"><span class="material-symbols-outlined">emoji_events</span> Tournaments</a>
                <a href="logs.html" class="t-nav-item"><span class="material-symbols-outlined">receipt_long</span> Audit Logs</a>
                <a href="settings.html" class="t-nav-item"><span class="material-symbols-outlined">settings</span> Settings</a>
            </nav>
            <div class="sidebar-footer">
                <a href="../index.html" class="t-nav-item"><span class="material-symbols-outlined">arrow_back</span> Back to Main</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div class="flex items-center gap-2">
                    <button class="mobile-menu-btn"><span class="material-symbols-outlined">menu</span></button>
                    <h2>Tournaments</h2>
                </div>
                <div class="page-header-actions">
                    <button onclick="openModal()" class="btn btn-primary">
                        <span class="material-symbols-outlined">add</span> Create Tournament
                    </button>
                </div>
            </header>

            <div id="tournamentsGrid" class="tournament-grid">
                <!-- Populated by JS -->
                <div class="loading-text" style="grid-column: 1 / -1;">Loading tournaments...</div>
            </div>
        </main>
    </div>

    <!-- Create/Edit Modal -->
    <div id="tournamentModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title" id="modalTitle">Create Tournament</h3>
            
            <form id="tournamentForm">
                <input type="hidden" id="tournamentId">
                
                <div class="form-group">
                    <label class="form-label">Tournament Name</label>
                    <input type="text" id="tName" required class="form-input" placeholder="e.g. SCU Autumn Cup">
                </div>

                <div class="form-group">
                    <label class="form-label">Game</label>
                    <select id="tGame" required class="form-select">
                        <!-- Populated via API -->
                    </select>
                </div>

                <div class="form-row form-group">
                    <div>
                        <label class="form-label">Start Date (Optional)</label>
                        <input type="date" id="tStartDate" class="form-input">
                    </div>
                    <div>
                        <label class="form-label">End Date (Optional)</label>
                        <input type="date" id="tEndDate" class="form-input">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Format (e.g. Double Elimination)</label>
                    <input type="text" id="tFormat" class="form-input" placeholder="e.g. Round Robin">
                </div>

                <div class="form-group">
                    <label class="form-label">Notes / Description</label>
                    <textarea id="tNotes" class="form-textarea" placeholder="Optional details..."></textarea>
                </div>
                
                <div class="modal-actions">
                    <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Tournament</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="dashboard.js"></script>
    <script src="tournaments.js"></script>
</body>
</html>
