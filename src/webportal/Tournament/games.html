<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Config | SCU Tournaments</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/tournament.css">
</head>
<body>
    <!-- Animated Particles -->
    <div class="bg-particles">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h1>SCU Tournaments</h1>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="t-nav-item"><span class="material-symbols-outlined">dashboard</span> Dashboard</a>
                <a href="games.html" class="t-nav-item active"><span class="material-symbols-outlined">sports_esports</span> Games</a>
                <a href="tournaments.html" class="t-nav-item"><span class="material-symbols-outlined">emoji_events</span> Tournaments</a>
                <a href="logs.html" class="t-nav-item"><span class="material-symbols-outlined">receipt_long</span> Audit Logs</a>
                <a href="settings.html" class="t-nav-item"><span class="material-symbols-outlined">settings</span> Settings</a>
            </nav>
            <div class="sidebar-footer">
                <a href="../index.html" class="t-nav-item"><span class="material-symbols-outlined">arrow_back</span> Back to Main</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div class="flex items-center gap-2">
                    <button class="mobile-menu-btn"><span class="material-symbols-outlined">menu</span></button>
                    <h2>Games Configuration</h2>
                </div>
                <div class="page-header-actions">
                    <button onclick="openModal()" class="btn btn-primary">
                        <span class="material-symbols-outlined">add</span> Add Game
                    </button>
                </div>
            </header>

            <div class="glass-card section-card card-animate">
                <div class="overflow-auto">
                    <table class="t-table" id="gamesTable">
                        <thead>
                            <tr>
                                <th>Game Name</th>
                                <th>Squad / Bench</th>
                                <th>Captain Role</th>
                                <th>Announcement Ch.</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="5" class="loading-text">Loading games...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="gameModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title" id="modalTitle">Add Game</h3>
            
            <form id="gameForm">
                <input type="hidden" id="gameId">
                
                <div class="form-group">
                    <label class="form-label">Game Name</label>
                    <input type="text" id="gameName" required class="form-input" placeholder="e.g. Valorant">
                </div>

                <div class="form-row form-group">
                    <div>
                        <label class="form-label">Squad Size (Starters)</label>
                        <input type="number" id="squadSize" required min="1" max="15" value="5" class="form-input">
                    </div>
                    <div>
                        <label class="form-label">Bench Size</label>
                        <input type="number" id="benchSize" required min="0" max="10" value="1" class="form-input">
                    </div>
                </div>

                <div class="form-row form-group">
                    <div>
                        <label class="form-label">Game Role (Optional)</label>
                        <select id="roleId" class="form-select"><option value="">None</option></select>
                    </div>
                    <div>
                        <label class="form-label">Captain Role (Required for submit)</label>
                        <select id="captainRoleId" class="form-select"><option value="">None</option></select>
                    </div>
                </div>

                <div class="form-row form-group">
                    <div>
                        <label class="form-label">Announcement Channel</label>
                        <select id="announcementChannelId" class="form-select"><option value="">None</option></select>
                    </div>
                    <div>
                        <label class="form-label">Team/Captain Channel</label>
                        <select id="channelId" class="form-select"><option value="">None</option></select>
                    </div>
                </div>
                
                <div class="modal-actions">
                    <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Game</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="dashboard.js"></script>
    <script src="games.js"></script>
</body>
</html>
